[package]
name = "lean-spec-harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Runs the Lean-generated vectors in tests/lean/vectors against UCS request and amount conversion"

[dependencies]

[dev-dependencies]
common_enums = { path = "../../../crates/common/common_enums", package = "ucs_common_enums" }
common_utils = { path = "../../../crates/common/common_utils", package = "ucs_common_utils" }
domain_types = { path = "../../../crates/types-traits/domain_types" }
grpc-api-types = { path = "../../../crates/types-traits/grpc-api-types" }
cards = { path = "../../../crates/types-traits/cards", package = "ucs_cards" }
hyperswitch_masking = { version = "0.0.1", default-features = false, features = ["alloc", "serde"] }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
