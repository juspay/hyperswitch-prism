services:
  pg:
    ports: !override
      - "127.0.0.1:${HS_DB_PORT:-15432}:5432"

  redis-standalone:
    ports: !reset []

  superposition:
    ports: !reset []

  ucs:
    build:
      context: .
      dockerfile: ${E2E_UCS_DOCKERFILE}
      args:
        UCS_IMAGE: ${UCS_IMAGE:-juspaydotin/hyperswitch-prism:latest}
    environment:
      CS__SERVER__HOST: 0.0.0.0
      CS__SERVER__PORT: 8000
      CS__COMMON__ENVIRONMENT: development
      CS__LOG__CONSOLE__ENABLED: "true"
      CS__LOG__CONSOLE__LEVEL: info
      CS__LOG__CONSOLE__LOG_FORMAT: json
    networks:
      - router_net

    healthcheck:
      test:
        [
          "CMD",
          "/bin/grpc_health_probe",
          "-addr=localhost:8000",
          "-connect-timeout=2s",
          "-rpc-timeout=2s",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  migration_runner:
    command:
      - bash
      - -c
      - >-
        set -eu &&
        apt-get update &&
        apt-get install -y curl xz-utils &&
        curl --proto '=https' --tlsv1.2 -LsSf
        https://github.com/diesel-rs/diesel/releases/download/v2.3.5/diesel_cli-installer.sh
        -o /tmp/install-diesel.sh &&
        bash /tmp/install-diesel.sh &&
        /root/.cargo/bin/diesel migration run
        --database-url "$${DATABASE_URL}"
        --migration-dir /app/migrations
        --config-file /e2e-diesel.toml
    volumes:
      - ${E2E_DIESEL_CONFIG}:/e2e-diesel.toml:ro
    depends_on:
      pg:
        condition: service_healthy

  superposition-init:
    command:
      - sh
      - -c
      - apk add --no-cache bash curl jq yq && bash /seed_superposition.sh

  hyperswitch-server:
    image: ${HS_IMAGE:-docker.juspay.io/juspaydotin/hyperswitch-router:latest}
    pull_policy: missing
    command:
      - /local/bin/router
      - -f
      - /local/config/docker_compose.toml
    ports: !override
      - "127.0.0.1:${HS_PORT:-8080}:8080"
    environment:
      ROUTER__GRPC_CLIENT__UNIFIED_CONNECTOR_SERVICE__BASE_URL: http://ucs:8000
      ROUTER__GRPC_CLIENT__UNIFIED_CONNECTOR_SERVICE__CONNECTION_TIMEOUT: "10"
      ROUTER__GRPC_CLIENT__UNIFIED_CONNECTOR_SERVICE__REQUEST_TIMEOUT: "60"
      ROUTER__GRPC_CLIENT__UNIFIED_CONNECTOR_SERVICE__UCS_ONLY_CONNECTORS: ${UCS_CONNECTORS:-adyen}
    depends_on:
      ucs:
        condition: service_healthy
    healthcheck:
      start_period: 60s
      retries: 30
