# Default / global configuration for the Kill Bill Hyperswitch Prism plugin.
#
# These are the per-tenant keys (also uploadable via the KillBill tenant API:
#   POST /1.0/kb/tenants/uploadPluginConfig/killbill-hyperswitch).
# Single connector per tenant (same model as the Medusa plugin).
#
# Which Prism connector to route to (selects the ConnectorSpecificConfig variant).
# Supported (parity with KillBill's own gateways): stripe, adyen, braintree, cybersource, paypal, forte.
# Not available via Prism: gocardless, qualpay, dwolla, orbital, securenet (these throw "Unsupported connector").
org.killbill.billing.plugin.hyperswitch.connector=stripe
# SANDBOX or PRODUCTION (maps to Prism SdkOptions.environment).
org.killbill.billing.plugin.hyperswitch.environment=SANDBOX
# Default capture behaviour for purchasePayment when unspecified (AUTOMATIC = sale, MANUAL = auth-only).
org.killbill.billing.plugin.hyperswitch.captureMethod=AUTOMATIC
# Redirect/return URL used for 3DS/redirect flows. Some connectors (Adyen) require one even for
# server-to-server no-3DS mandate setup; the plugin defaults to a placeholder when unset.
#org.killbill.billing.plugin.hyperswitch.returnUrl=https://example.com/return
# Webhook verification secret passed to Prism EventService.handle_event (required to process webhooks).
#org.killbill.billing.plugin.hyperswitch.webhookSecret=

# ---- Per-connector credentials (namespaced under the connector name) ----
# Stripe
#org.killbill.billing.plugin.hyperswitch.stripe.apiKey=sk_test_xxx
#org.killbill.billing.plugin.hyperswitch.stripe.baseUrl=
# Adyen
#org.killbill.billing.plugin.hyperswitch.adyen.apiKey=
#org.killbill.billing.plugin.hyperswitch.adyen.merchantAccount=
# Cybersource
#org.killbill.billing.plugin.hyperswitch.cybersource.apiKey=
#org.killbill.billing.plugin.hyperswitch.cybersource.merchantAccount=
#org.killbill.billing.plugin.hyperswitch.cybersource.apiSecret=
# AVS/CVN checks (sandbox often needs them disabled to avoid address-verification declines)
#org.killbill.billing.plugin.hyperswitch.cybersource.disableAvs=true
#org.killbill.billing.plugin.hyperswitch.cybersource.disableCvn=true
# Braintree
#org.killbill.billing.plugin.hyperswitch.braintree.publicKey=
#org.killbill.billing.plugin.hyperswitch.braintree.privateKey=
#org.killbill.billing.plugin.hyperswitch.braintree.merchantAccountId=
# Required for the recurring (MIT) charge flow: currency of the Braintree merchant account.
#org.killbill.billing.plugin.hyperswitch.braintree.merchantConfigCurrency=USD
#org.killbill.billing.plugin.hyperswitch.braintree.baseUrl=
# PayPal
#org.killbill.billing.plugin.hyperswitch.paypal.clientId=
#org.killbill.billing.plugin.hyperswitch.paypal.clientSecret=
#org.killbill.billing.plugin.hyperswitch.paypal.payerId=
#org.killbill.billing.plugin.hyperswitch.paypal.baseUrl=
# Forte
#org.killbill.billing.plugin.hyperswitch.forte.apiAccessId=
#org.killbill.billing.plugin.hyperswitch.forte.organizationId=
#org.killbill.billing.plugin.hyperswitch.forte.locationId=
#org.killbill.billing.plugin.hyperswitch.forte.apiSecretKey=
#org.killbill.billing.plugin.hyperswitch.forte.baseUrl=

# Optional connector-specific request metadata JSON, sent on mandate setup and MIT charges.
# Defaults to {} (some connector transformers, e.g. Cybersource, reject requests with no metadata).
#org.killbill.billing.plugin.hyperswitch.<connector>.metadata={}
