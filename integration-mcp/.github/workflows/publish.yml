name: publish

on:
  push:
    tags:
      - "integration-mcp-v*"
  workflow_dispatch:

defaults:
  run:
    working-directory: integration-mcp

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Regenerate connector data and fail on drift
        run: |
          npm run gen:connectors
          git diff --exit-code src/data/connectors.generated.json src/data/enums.generated.json \
            || (echo "::error::connectors.generated.json is stale — run npm run gen:connectors and commit" && exit 1)
      - run: npm run build
      - run: npm run smoke

  publish-npm:
    needs: build-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-mcp-registry:
    needs: publish-npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Install MCP publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
      - name: Login and publish to MCP registry
        env:
          MCP_REGISTRY_TOKEN: ${{ secrets.MCP_REGISTRY_TOKEN }}
        run: |
          ./mcp-publisher login github-oidc || ./mcp-publisher login dns --token "$MCP_REGISTRY_TOKEN" || true
          ./mcp-publisher publish
        working-directory: integration-mcp
