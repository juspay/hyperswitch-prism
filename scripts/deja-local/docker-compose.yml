# Local déjà recording pipeline: Kafka (tape transport) → Vector (shipper) → MinIO (tape store).
# Mirrors the production shape; everything runs on localhost.
#
#   docker compose -f scripts/deja-local/docker-compose.yml up -d
#
# Endpoints:
#   Kafka broker  localhost:9092   (in-network: kafka:29092)
#   MinIO S3      localhost:9000   (console: localhost:9001, minioadmin/minioadmin)
#   Tapes bucket  s3://deja-tapes/tapes/<date>/*.jsonl

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: deja-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  minio:
    image: minio/minio:latest
    container_name: deja-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

  # One-shot: create the tapes bucket.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/deja-tapes;
      exit 0"

  vector:
    image: timberio/vector:0.46.1-alpine
    container_name: deja-vector
    depends_on:
      - kafka
      - minio
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
    command: ["--config", "/etc/vector/vector.toml"]
