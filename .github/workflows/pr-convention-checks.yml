name: Pull Request Convention Checks

on:
  # This is a dangerous event trigger as it causes the workflow to run in the
  # context of the target repository.
  # Avoid checking out the head of the pull request or building code from the
  # pull request whenever this trigger is used.
  # Since we do not have a checkout step in this workflow, this is an
  # acceptable use of this trigger.
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - ready_for_review
      - synchronize

  merge_group:
    types:
      - checks_requested

env:
  # Allow more retries for network requests in cargo (downloading crates) and
  # rustup (installing toolchains). This should help to reduce flaky CI failures
  # from transient network timeouts or other issues.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  pr_title_conventional_commit_check:
    name: Verify PR title follows conventional commit standards
    runs-on: ubuntu-latest

    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cocogitto
          checksum: true

      - name: Verify PR title follows conventional commit standards
        if: ${{ github.event_name == 'pull_request_target' }}
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: cog verify "$TITLE"

      - name: Verify commit message follows conventional commit standards
        if: ${{ github.event_name == 'merge_group' }}
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.merge_group.head_commit.message }}
        run: cog verify "$COMMIT_MESSAGE"

  deja_art_label_check:
    name: Verify PR carries the deja-art label
    runs-on: ubuntu-latest

    steps:
      # The `deja-art` label is what starts a Deja ART replay of this pull
      # request against recorded sandbox traffic. Every pull request must
      # carry it, so every change gets replayed. The replay's VERDICT does not
      # gate the merge; the label does. A pull request labelled after this
      # check ran re-runs it on the next push or title edit.
      #
      # Automated pull requests (release and hotfix flows) are exempt: their
      # authors cannot add a label, and a replay of a version bump adds nothing.
      - name: Verify PR carries the deja-art label
        if: ${{ github.event_name == 'pull_request_target' }}
        shell: bash
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$AUTHOR" in
            github-actions\[bot\]|hyperswitch-bot\[bot\])
              echo "Automated pull request by $AUTHOR; the deja-art label is not required."
              exit 0
              ;;
          esac
          if [[ ",$LABELS," == *",deja-art,"* ]]; then
            echo "Label deja-art present; a Deja ART replay will run for this pull request."
            exit 0
          fi
          echo "::error::This pull request must carry the 'deja-art' label."
          echo "The label starts a Deja ART replay of this change against recorded sandbox traffic."
          echo "Add the label, then push or edit the title to re-run this check."
          echo "The replay's verdict is reported on the pull request but does not block the merge."
          exit 1

      # A change reaches the merge queue only after this check passed on its
      # pull request, and a merge group carries no labels to read.
      - name: Nothing to verify in the merge queue
        if: ${{ github.event_name == 'merge_group' }}
        run: echo "Merge group - the label was verified on the pull request."
