name: Pull Request Convention Checks

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - ready_for_review
      - synchronize

  merge_group:
    types:
      - checks_requested

env:
  # Allow more retries for network requests in cargo (downloading crates) and
  # rustup (installing toolchains). This should help to reduce flaky CI failures
  # from transient network timeouts or other issues.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  pr_title_conventional_commit_check:
    name: Verify PR title follows conventional commit standards
    runs-on: ubuntu-latest

    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cocogitto
          checksum: true

      - name: Verify PR title follows conventional commit standards
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: cog verify "$TITLE"

      - name: Verify commit message follows conventional commit standards
        if: ${{ github.event_name == 'merge_group' }}
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.merge_group.head_commit.message }}
        run: cog verify "$COMMIT_MESSAGE"

  deja_art_label_check:
    name: Verify PR carries the deja-art label
    runs-on: ubuntu-latest

    steps:
      # The `deja-art` label starts a Deja ART replay of the pull request
      # against recorded sandbox traffic. Every pull request must carry it.
      # The replay's verdict does not gate the merge; the label does.
      #
      # Labels are read live rather than from the event payload, so re-running
      # this check after adding the label is enough.
      - name: Verify PR carries the deja-art label
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name')"
          if grep -qx 'deja-art' <<< "$labels"; then
            echo "Label deja-art present; a Deja ART replay will run for this pull request."
            exit 0
          fi
          echo "::error::This pull request must carry the 'deja-art' label. Add it and re-run this check."
          exit 1

      # A change reaches the merge queue only after this check passed on its
      # pull request, and a merge group has no pull request to read labels from.
      - name: Nothing to verify in the merge queue
        if: ${{ github.event_name == 'merge_group' }}
        run: echo "Merge group - the label was verified on the pull request."
