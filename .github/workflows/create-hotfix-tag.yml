name: Create tag on hotfix branch

on:
  workflow_dispatch:

concurrency:
  group: hotfix-release
  cancel-in-progress: false

jobs:
  create_tag:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub app token
        id: generate_app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CONNECTOR_SERVICE_BOT_APP_ID }}
          private-key: ${{ secrets.CONNECTOR_SERVICE_BOT_APP_PRIVATE_KEY }}

      - name: Check if user is authorized to trigger workflow
        shell: bash
        env:
          GH_TOKEN: ${{ steps.generate_app_token.outputs.token }}
          ORG_NAME: ${{ github.repository_owner }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "::add-mask::${GH_TOKEN}"

          function is_user_team_member() {
            username="${1}"
            team_slug="${2}"

            # The API returns 200 if the user is a member of the team and 404
            # otherwise, so compare on the HTTP status code.
            status_code="$(
              curl \
                --location \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/orgs/${ORG_NAME}/teams/${team_slug}/memberships/${username}"
            )"

            [[ status_code -eq 200 ]]
          }

          allowed_teams=('connector-service-maintainers')
          is_user_authorized=false
          username="${TRIGGERING_ACTOR}"

          for team in "${allowed_teams[@]}"; do
            if is_user_team_member "${username}" "${team}"; then
              is_user_authorized=true
              break
            fi
          done

          if ${is_user_authorized}; then
            echo "${username} is authorized to trigger workflow"
          else
            printf -v allowed_teams_comma_separated '%s, ' "${allowed_teams[@]}"
            echo "::error::${username} is not authorized to trigger workflow; must be a member of one of these teams: ${allowed_teams_comma_separated%, }"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CONNECTOR_SERVICE_CI_PAT }}

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
          checksum: true

      - name: Check if the input is valid hotfix branch
        shell: bash
        env:
          GITHUB_WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "${GITHUB_WORKFLOW_REF}" =~ ^refs/heads/hotfix-[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::notice::${GITHUB_WORKFLOW_REF} is a valid hotfix branch."
          else
            echo "::error::${GITHUB_WORKFLOW_REF} is not a valid hotfix branch."
            exit 1
          fi

      - name: Check if the latest commit is tag
        shell: bash
        run: |
          if [[ -z "$(git tag --points-at HEAD)" ]]; then
            echo "::notice::The latest commit is not a tag"
          else
            echo "::error::The latest commit on the branch is already a tag"
            exit 1
          fi

      - name: Determine current and next tag
        shell: bash
        run: |
          function get_next_tag() {
            local previous_tag="${1}"
            local previous_hotfix_number
            local next_tag

            previous_hotfix_number="$(echo "${previous_tag}" | awk -F. '{ print $4 }' | sed -E 's/([0-9]+)(-hotfix([0-9]+))?/\3/')"

            if [[ -z "${previous_hotfix_number}" ]]; then
              # Previous tag was not a hotfix tag
              next_tag="${previous_tag}-hotfix1"
            else
              # Previous tag was a hotfix tag, increment hotfix number
              local hotfix_number=$((previous_hotfix_number + 1))
              next_tag="${previous_tag/%${previous_hotfix_number}/${hotfix_number}}"
            fi

            echo "${next_tag}"
          }

          # Search for date-like tags (no strict checking), sort and obtain previous tag
          PREVIOUS_TAG="$(
              git tag --merged \
                | grep --extended-regexp '[0-9]{4}\.[0-9]{2}\.[0-9]{2}' \
                | sort --version-sort \
                | tail --lines 1
          )"
          NEXT_TAG="$(get_next_tag "${PREVIOUS_TAG}")"

          echo "PREVIOUS_TAG=${PREVIOUS_TAG}" >> $GITHUB_ENV
          echo "NEXT_TAG=${NEXT_TAG}" >> $GITHUB_ENV

      - name: Generate changelog
        shell: bash
        run: |
          # The sed insertion below anchors on the `- - -` marker; if it is
          # missing, the in-place edit silently does nothing and an unchanged
          # CHANGELOG would be committed. Fail loudly instead.
          if ! grep -q '^- - -' CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing the '- - -' marker; cannot insert release notes."
            exit 1
          fi

          # Generate changelog content and store it in `release-notes.md`
          git-cliff --config '.github/git-cliff-changelog.toml' --strip header --tag "${NEXT_TAG}" "${PREVIOUS_TAG}^.." \
            | sed "/## ${PREVIOUS_TAG#v}\$/,\$d" \
            | sed '$s/$/\n- - -/' > release-notes.md

          # Append release notes after the specified pattern in CHANGELOG.md
          sed --in-place '0,/^- - -/!b; /^- - -/{
            a
            r release-notes.md
          }' CHANGELOG.md
          rm release-notes.md

      - name: Set Git Configuration
        shell: bash
        run: |
          git config --local user.name 'connector-service-bot[bot]'
          git config --local user.email '148525504+connector-service-bot[bot]@users.noreply.github.com'

      - name: Push created commit and tag
        shell: bash
        run: |
          # Stage, commit and tag the changelog
          git add CHANGELOG.md
          git commit --message "chore(version): ${NEXT_TAG}"
          git tag --message "$(git show --no-patch --format=%s HEAD)" "${NEXT_TAG}" HEAD
          git push
          git push --tags