name: Release SDK

on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: 'Preview only (do not actually publish)'
        required: false
        default: false
        type: boolean
      publish_java:
        description: 'Publish Java SDK to Maven Central'
        required: false
        default: false
        type: boolean
      publish_python:
        description: 'Publish Python SDK to PyPI'
        required: false
        default: false
        type: boolean
      publish_javascript:
        description: 'Publish JavaScript SDK to npm'
        required: false
        default: false
        type: boolean
      ref:
        description: 'Git ref to checkout (tag or branch)'
        required: false
        default: ''
        type: string
      version:
        description: 'Version to publish (e.g. 0.1.0) — overrides version in manifest files'
        required: false
        default: ''
        type: string

  workflow_call:
    inputs:
      publish_java:
        required: false
        default: false
        type: boolean
      publish_python:
        required: false
        default: false
        type: boolean
      publish_javascript:
        required: false
        default: false
        type: boolean
      preview_only:
        required: false
        default: true
        type: boolean
      ref:
        required: false
        default: ''
        type: string
      version:
        required: false
        default: ''
        type: string
    secrets:
      CONNECTOR_SERVICE_CI_PAT:
        required: true
      CENTRAL_TOKEN_USERNAME:
        required: true
      CENTRAL_TOKEN_PASSWORD:
        required: true
      GPG_SIGNING_KEY:
        required: true
      GPG_SIGNING_KEY_PASSWORD:
        required: true
      PYPI_TOKEN:
        required: true

# Literal group, not ${{ github.workflow }}: when called via `uses:` that resolves
# to the caller's name and collides with the caller's group, deadlocking the run.
concurrency:
  group: release-sdks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  CARGO_NET_RETRY: 10
  RUSTFLAGS: "-C codegen-units=16"

jobs:
  setup:
    name: Normalize inputs
    runs-on: ubuntu-latest
    outputs:
      preview_only: ${{ steps.norm.outputs.preview_only }}
      publish_java: ${{ steps.norm.outputs.publish_java }}
      publish_python: ${{ steps.norm.outputs.publish_python }}
      publish_javascript: ${{ steps.norm.outputs.publish_javascript }}
      version: ${{ steps.norm.outputs.version }}
    steps:
      - name: Normalize and validate inputs
        id: norm
        shell: bash
        run: |
          # workflow_dispatch delivers boolean inputs as strings, while
          # workflow_call delivers real booleans. Comparing inputs.* against a
          # boolean literal (== true / == false) in a job `if:` therefore fails
          # for dispatch — string-vs-boolean coerces to NaN and is never equal —
          # which silently skips the package/collect/preview/publish chain.
          # Normalize to canonical "true"/"false" strings here (bash sees the
          # rendered string either way) so every downstream `if:` can compare
          # against string literals reliably for both triggers.
          norm() { case "$1" in true|True|TRUE) echo "true" ;; *) echo "false" ;; esac; }
          PREVIEW="$(norm "${{ inputs.preview_only }}")"
          echo "preview_only=${PREVIEW}" >> "$GITHUB_OUTPUT"
          echo "publish_java=$(norm "${{ inputs.publish_java }}")" >> "$GITHUB_OUTPUT"
          echo "publish_python=$(norm "${{ inputs.publish_python }}")" >> "$GITHUB_OUTPUT"
          echo "publish_javascript=$(norm "${{ inputs.publish_javascript }}")" >> "$GITHUB_OUTPUT"

          VERSION="${{ inputs.version }}"
          REF="${{ inputs.ref }}"

          if [ "${PREVIEW}" = "false" ]; then
            # Publishing: a real SemVer is mandatory.
            if [ -z "${VERSION}" ]; then
              echo "::error::version input is required when publishing (preview_only=false)"
              exit 1
            fi
            if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version '${VERSION}' is not valid SemVer (expected X.Y.Z)"
              exit 1
            fi
            # Tag-only: publish must build from the matching release tag, not a branch.
            if [ "${REF}" != "v${VERSION}" ] && [ "${REF}" != "${VERSION}" ]; then
              echo "::error::publishing requires ref to be the release tag 'v${VERSION}' (got '${REF}'); publishing from a branch is not allowed"
              exit 1
            fi
            echo "Publishing version ${VERSION} from tag ${REF}"
          else
            # Preview: empty version is fine; default to a plain "0.0.0" so the
            # builders never see "" (which breaks the Java jar name). Avoid suffixes
            # like "-preview" — PEP 440 rewrites them and renames the Python wheel.
            if [ -z "${VERSION}" ]; then
              VERSION="0.0.0"
              echo "No version supplied for preview — defaulting to ${VERSION}"
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build Binaries (${{ matrix.os }} ${{ matrix.arch }})
    needs: [setup]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: macos
            arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-latest
          - os: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - os: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.target }}"
          cache-directories: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install PostgreSQL (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install libpq
          echo "LIBRARY_PATH=$(brew --prefix libpq)/lib:$LIBRARY_PATH" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Build binary (${{ matrix.target }})
        run: make -C sdk/java build-ffi-lib PROFILE=release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/libconnector_service_ffi.*

      - name: Verify FFI library has UniFFI scaffolding
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          count=$(nm target/${{ matrix.target }}/release/libconnector_service_ffi.dylib \
                  2>/dev/null | grep -c "_uniffi_" || echo 0)
          echo "uniffi_ symbols in library: $count"
          [ "$count" -gt 0 ] || \
            (echo "ERROR: library missing uniffi scaffolding — was it built with --features uniffi?" && exit 1)

      - name: Set up Python (for SDK codegen)
        if: matrix.target == 'aarch64-apple-darwin'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Java SDK (UniFFI Kotlin bindings + Java proto stubs)
        if: matrix.target == 'aarch64-apple-darwin'
        run: make -C sdk/java generate-all

      - name: Upload UniFFI Kotlin bindings
        if: matrix.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: generated-kotlin
          path: sdk/java/src/main/kotlin/generated/

      - name: Upload Java proto stubs
        if: matrix.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: generated-java-proto
          path: sdk/java/src/main/java/generated/

      - name: Generate Python SDK (UniFFI Python bindings + Python proto stubs)
        if: matrix.target == 'aarch64-apple-darwin'
        run: make -C sdk/python generate-all

      - name: Upload Python SDK generated files
        if: matrix.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: generated-python
          path: sdk/python/src/payments/generated/

      - name: Generate JavaScript SDK (JS proto stubs + native lib)
        if: matrix.target == 'aarch64-apple-darwin'
        run: make -C sdk/javascript generate-all PROFILE=release

      - name: Upload JavaScript SDK generated files
        if: matrix.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: generated-javascript
          path: sdk/javascript/src/payments/generated/

  package-sdk-java:
    name: Package Java SDK
    runs-on: ubuntu-latest
    needs: [setup, build-binaries]
    if: ${{ needs.setup.outputs.preview_only == 'true' || needs.setup.outputs.publish_java == 'true' }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: target
      - name: Organize binaries
        run: |
          for dir in target/binary-*; do
            if [ -d "$dir" ]; then
              target_name=$(basename "$dir" | sed 's/binary-//')
              mkdir -p "target/$target_name/release"
              cp "$dir"/* "target/$target_name/release/" 2>/dev/null || true
            fi
          done
      - name: Download UniFFI Kotlin bindings
        uses: actions/download-artifact@v4
        with:
          name: generated-kotlin
          path: sdk/java/src/main/kotlin/generated/
      - name: Download Java proto stubs
        uses: actions/download-artifact@v4
        with:
          name: generated-java-proto
          path: sdk/java/src/main/java/generated/
      - name: Package Java SDK
        run: make -C sdk/java dist
      - name: Upload Java SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-java
          path: artifacts/sdk-java/*.jar

  package-sdk-python:
    name: Package Python SDK
    runs-on: ubuntu-latest
    needs: [setup, build-binaries]
    if: ${{ needs.setup.outputs.preview_only == 'true' || needs.setup.outputs.publish_python == 'true' }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: target
      - name: Organize binaries
        run: |
          for dir in target/binary-*; do
            if [ -d "$dir" ]; then
              target_name=$(basename "$dir" | sed 's/binary-//')
              mkdir -p "target/$target_name/release"
              cp "$dir"/* "target/$target_name/release/" 2>/dev/null || true
            fi
          done
      - name: Download Python SDK generated files
        uses: actions/download-artifact@v4
        with:
          name: generated-python
          path: sdk/python/src/payments/generated/
      - name: Package Python SDK
        run: make -C sdk/python dist
      - name: Upload Python SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-python
          path: artifacts/sdk-python/*.whl

  package-sdk-javascript:
    name: Package JavaScript SDK
    runs-on: ubuntu-latest
    needs: [setup, build-binaries]
    if: ${{ needs.setup.outputs.preview_only == 'true' || needs.setup.outputs.publish_javascript == 'true' }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: target
      - name: Organize binaries
        run: |
          for dir in target/binary-*; do
            if [ -d "$dir" ]; then
              target_name=$(basename "$dir" | sed 's/binary-//')
              mkdir -p "target/$target_name/release"
              cp "$dir"/* "target/$target_name/release/" 2>/dev/null || true
            fi
          done
      - name: Download JavaScript SDK generated files
        uses: actions/download-artifact@v4
        with:
          name: generated-javascript
          path: sdk/javascript/src/payments/generated/
      - name: Package JavaScript SDK
        run: make -C sdk/javascript dist
      - name: Upload JavaScript SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-javascript
          path: artifacts/sdk-javascript/*.tgz

  collect-sdks:
    name: Collect SDK Artifacts
    runs-on: ubuntu-latest
    needs: [package-sdk-java, package-sdk-python, package-sdk-javascript]
    if: always() && (needs.package-sdk-java.result == 'success' || needs.package-sdk-python.result == 'success' || needs.package-sdk-javascript.result == 'success')
    steps:
      - name: Download all SDK artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/sdks
          pattern: sdk-*
      - name: Upload combined SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdks
          path: artifacts/sdks/**/*

  preview-publish:
    name: Preview What Will Be Published
    runs-on: ubuntu-latest
    needs: [setup, collect-sdks]
    if: always() && needs.collect-sdks.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Download Java SDK artifact
        if: ${{ needs.setup.outputs.preview_only == 'true' || needs.setup.outputs.publish_java == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: sdk-java
          path: artifacts/sdk-java
      - name: Download Python SDK artifact
        if: ${{ needs.setup.outputs.preview_only == 'true' || needs.setup.outputs.publish_python == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: sdk-python
          path: artifacts/sdk-python
      - name: Download JavaScript SDK artifact
        if: ${{ needs.setup.outputs.preview_only == 'true' || needs.setup.outputs.publish_javascript == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: sdk-javascript
          path: artifacts/sdk-javascript
      - name: Show Preview
        run: |
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║        📦 SDK PUBLICATION PREVIEW                              ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Java SDK (Maven Central):"
          echo "  Location: artifacts/sdk-java/"
          ls -la artifacts/sdk-java/*.jar 2>/dev/null || echo "  ❌ No JAR found"
          echo ""
          echo "Python SDK (PyPI):"
          echo "  Location: artifacts/sdk-python/"
          ls -la artifacts/sdk-python/*.whl 2>/dev/null || echo "  ❌ No wheel found"
          echo ""
          echo "JavaScript SDK (npm):"
          echo "  Location: artifacts/sdk-javascript/"
          ls -la artifacts/sdk-javascript/*.tgz 2>/dev/null || echo "  ❌ No tarball found"
          echo ""
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          if [ "${{ inputs.preview_only }}" == "true" ]; then
            echo "⚠️  PREVIEW ONLY MODE - No SDKs will be published"
          elif [ "${{ inputs.publish_java }}" == "true" ] || [ "${{ inputs.publish_python }}" == "true" ] || [ "${{ inputs.publish_javascript }}" == "true" ]; then
            echo "✅ The following SDKs will be published:"
            [ "${{ inputs.publish_java }}" == "true" ] && echo "   - Java SDK → Maven Central"
            [ "${{ inputs.publish_python }}" == "true" ] && echo "   - Python SDK → PyPI"
            [ "${{ inputs.publish_javascript }}" == "true" ] && echo "   - JavaScript SDK → npm"
          else
            echo "ℹ️  No SDKs selected for publishing (all checkboxes unchecked)"
          fi
          echo ""
          echo "═══════════════════════════════════════════════════════════════════"

  pre-publish-check:
    name: Pre-Publish Validation
    runs-on: ubuntu-latest
    needs: [setup, collect-sdks]
    if: always() && needs.collect-sdks.result == 'success' && (needs.setup.outputs.preview_only == 'true' || needs.setup.outputs.publish_java == 'true' || needs.setup.outputs.publish_python == 'true' || needs.setup.outputs.publish_javascript == 'true')
    # id-token so the npm auth check can verify OIDC issuance pre-flight.
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Kept in step with the publish job so the dry-run exercises the same npm.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all generated artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: generated-*
          path: generated-artifacts

      - name: Organize generated artifacts
        run: |
          # Python
          mkdir -p sdk/python/src/payments/generated
          cp -r generated-artifacts/generated-python/* sdk/python/src/payments/generated/ 2>/dev/null || true
          # JavaScript
          mkdir -p sdk/javascript/src/payments/generated
          cp -r generated-artifacts/generated-javascript/* sdk/javascript/src/payments/generated/ 2>/dev/null || true
          # Java Kotlin bindings
          mkdir -p sdk/java/src/main/kotlin/generated
          cp -r generated-artifacts/generated-kotlin/* sdk/java/src/main/kotlin/generated/ 2>/dev/null || true
          # Java proto stubs
          mkdir -p sdk/java/src/main/java/generated
          cp -r generated-artifacts/generated-java-proto/* sdk/java/src/main/java/generated/ 2>/dev/null || true

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: target

      - name: Organize binaries
        run: |
          for dir in target/binary-*; do
            if [ -d "$dir" ]; then
              target_name=$(basename "$dir" | sed 's/binary-//')
              mkdir -p "target/$target_name/release"
              cp "$dir"/* "target/$target_name/release/" 2>/dev/null || true
            fi
          done

      - name: Install Python tools
        run: pip install twine build

      - name: Install JavaScript dependencies
        run: cd sdk/javascript && npm install --silent

      # --- Auth checks ---
      - name: Check Java auth
        id: check-java-auth
        if: ${{ needs.setup.outputs.preview_only == 'true' || needs.setup.outputs.publish_java == 'true' }}
        continue-on-error: true
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_KEY_PASSWORD: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
        run: make -C sdk/java publish-check-auth

      - name: Check Python auth
        id: check-python-auth
        if: ${{ needs.setup.outputs.preview_only == 'true' || needs.setup.outputs.publish_python == 'true' }}
        continue-on-error: true
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: make -C sdk/python publish-check-auth

      # There is no stored npm token to check `npm whoami` against any more.
      # The publish credential is minted from the GitHub OIDC token at publish
      # time, so the pre-flight equivalent is confirming this run can actually
      # mint one. It cannot verify the trusted-publisher config on npmjs.com —
      # only that the OIDC half works.
      - name: Check JavaScript auth (OIDC)
        id: check-js-auth
        if: ${{ needs.setup.outputs.preview_only == 'true' || needs.setup.outputs.publish_javascript == 'true' }}
        continue-on-error: true
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "Error: no OIDC token endpoint — job is missing 'id-token: write'"
            exit 1
          fi
          token="$(curl -sf \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | jq -r '.value // empty')"
          if [ -z "$token" ]; then
            echo "Error: failed to mint an OIDC token for npm"
            exit 1
          fi
          echo "OIDC token minted for npm (workflow_ref must match the trusted publisher on npmjs.com)"

      # --- Version checks ---
      - name: Check Java version
        id: check-java-version
        if: ${{ needs.setup.outputs.preview_only == 'true' || needs.setup.outputs.publish_java == 'true' }}
        continue-on-error: true
        run: make -C sdk/java publish-check-version

      - name: Check Python version
        id: check-python-version
        if: ${{ needs.setup.outputs.preview_only == 'true' || needs.setup.outputs.publish_python == 'true' }}
        continue-on-error: true
        run: make -C sdk/python publish-check-version

      - name: Check JavaScript version
        id: check-js-version
        if: ${{ needs.setup.outputs.preview_only == 'true' || needs.setup.outputs.publish_javascript == 'true' }}
        continue-on-error: true
        working-directory: sdk/javascript
        run: |
          PACKAGE_VERSION="${VERSION:-$(node -p "require('./package.json').version")}"
          echo "Checking if hyperswitch-prism $PACKAGE_VERSION exists on npm..."
          if npm view hyperswitch-prism@$PACKAGE_VERSION version >/dev/null 2>&1; then
            echo "Error: Version $PACKAGE_VERSION already exists on npm"
            exit 1
          fi
          echo "Version $PACKAGE_VERSION does not exist on npm - OK to publish"

      # --- Dry-run checks ---
      - name: Download Java SDK artifact for dry-run
        if: ${{ needs.setup.outputs.preview_only == 'true' || needs.setup.outputs.publish_java == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: sdk-java
          path: artifacts/sdk-java

      - name: Java dry-run (verify bundle)
        id: check-java-dryrun
        if: ${{ needs.setup.outputs.preview_only == 'true' || needs.setup.outputs.publish_java == 'true' }}
        continue-on-error: true
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_KEY_PASSWORD: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
        run: |
          # Copy the JAR to build/libs where Gradle expects it
          mkdir -p sdk/java/build/libs
          cp artifacts/sdk-java/*.jar sdk/java/build/libs/
          make -C sdk/java publish-check-dry-run

      - name: Download Python SDK artifact for dry-run
        if: ${{ needs.setup.outputs.preview_only == 'true' || needs.setup.outputs.publish_python == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: sdk-python
          path: artifacts/sdk-python

      - name: Python dry-run (twine check)
        id: check-python-dryrun
        if: ${{ needs.setup.outputs.preview_only == 'true' || needs.setup.outputs.publish_python == 'true' }}
        continue-on-error: true
        run: make -C sdk/python publish-check-dry-run

      - name: Download JavaScript SDK artifact for dry-run
        if: ${{ needs.setup.outputs.preview_only == 'true' || needs.setup.outputs.publish_javascript == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: sdk-javascript
          path: artifacts/sdk-javascript

      - name: JavaScript dry-run (npm publish --dry-run)
        id: check-js-dryrun
        if: ${{ needs.setup.outputs.preview_only == 'true' || needs.setup.outputs.publish_javascript == 'true' }}
        continue-on-error: true
        working-directory: sdk/javascript
        run: |
          npm ci
          npm publish ../../artifacts/sdk-javascript/*.tgz --dry-run --access public

      - name: Pre-Publish Check Summary
        run: |
          echo "=== Pre-Publish Check Summary ==="
          echo ""
          FAILED=0

          # Java checks
          java_auth="${{ steps.check-java-auth.outcome }}"
          java_ver="${{ steps.check-java-version.outcome }}"
          java_dry="${{ steps.check-java-dryrun.outcome }}"
          if [ "$java_auth" == "failure" ] || [ "$java_ver" == "failure" ] || [ "$java_dry" == "failure" ]; then
            echo "  Java: FAILED (auth=$java_auth, version=$java_ver, dry-run=$java_dry)"
            [ "${{ inputs.publish_java }}" == "true" ] && FAILED=1
          else
            echo "  Java: PASSED"
          fi

          # Python checks
          py_auth="${{ steps.check-python-auth.outcome }}"
          py_ver="${{ steps.check-python-version.outcome }}"
          py_dry="${{ steps.check-python-dryrun.outcome }}"
          if [ "$py_auth" == "failure" ] || [ "$py_ver" == "failure" ] || [ "$py_dry" == "failure" ]; then
            echo "  Python: FAILED (auth=$py_auth, version=$py_ver, dry-run=$py_dry)"
            [ "${{ inputs.publish_python }}" == "true" ] && FAILED=1
          else
            echo "  Python: PASSED"
          fi

          # JavaScript checks
          js_auth="${{ steps.check-js-auth.outcome }}"
          js_ver="${{ steps.check-js-version.outcome }}"
          js_dry="${{ steps.check-js-dryrun.outcome }}"
          if [ "$js_auth" == "failure" ] || [ "$js_ver" == "failure" ] || [ "$js_dry" == "failure" ]; then
            echo "  JavaScript: FAILED (auth=$js_auth, version=$js_ver, dry-run=$js_dry)"
            [ "${{ inputs.publish_javascript }}" == "true" ] && FAILED=1
          else
            echo "  JavaScript: PASSED"
          fi

          echo ""
          if [ "$FAILED" -eq 1 ]; then
            echo "One or more pre-publish checks FAILED. Publishing will be blocked."
            exit 1
          fi
          if [ "${{ inputs.preview_only }}" == "true" ]; then
            echo "PREVIEW ONLY MODE - No SDKs will be published"
          else
            echo "All pre-publish checks passed. Proceeding to publish."
          fi

  publish-java:
    name: Publish Java SDK to Maven Central
    runs-on: ubuntu-latest
    needs: [setup, preview-publish, pre-publish-check]
    if: always() && needs.setup.outputs.publish_java == 'true' && needs.setup.outputs.preview_only == 'false' && needs.pre-publish-check.result == 'success'
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download SDK artifacts
        uses: actions/download-artifact@v4
        with:
          name: sdk-java
          path: artifacts/sdk-java
      - name: Download generated Kotlin bindings
        uses: actions/download-artifact@v4
        with:
          name: generated-kotlin
          path: sdk/java/src/main/kotlin/generated/
      - name: Download generated Java proto stubs
        uses: actions/download-artifact@v4
        with:
          name: generated-java-proto
          path: sdk/java/src/main/java/generated/
      - name: Download Linux x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: binary-x86_64-unknown-linux-gnu
          path: target/x86_64-unknown-linux-gnu/release
      - name: Download Linux aarch64 binary
        uses: actions/download-artifact@v4
        with:
          name: binary-aarch64-unknown-linux-gnu
          path: target/aarch64-unknown-linux-gnu/release
      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: binary-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release
      - name: Check what will be published (Java)
        run: |
          echo "=== Java SDK Publication Preview ==="
          echo "Artifact location: artifacts/sdk-java/"
          ls -la artifacts/sdk-java/
          echo ""
          echo "Gradle publish task (dry run):"
          cd sdk/java && ./gradlew tasks --group=publishing 2>/dev/null || echo "Gradle tasks unavailable"
          echo ""
          echo "Package details:"
          find artifacts/sdk-java -name "*.jar" -exec jar -tf {} \; | head -20
          echo ""
          if [ "${{ inputs.preview_only }}" == "true" ]; then
            echo "⚠️ PREVIEW ONLY MODE - Skipping actual publish"
          else
            echo "✅ Will publish to Maven Central"
          fi
      - name: Publish to Maven Central
        if: ${{ needs.setup.outputs.preview_only == 'false' }}
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_KEY_PASSWORD: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
        run: |
          # Copy the JAR to build/libs where Gradle expects it
          mkdir -p sdk/java/build/libs
          cp artifacts/sdk-java/*.jar sdk/java/build/libs/
          make -C sdk/java publish

  publish-python:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    needs: [setup, preview-publish, pre-publish-check]
    if: always() && needs.setup.outputs.publish_python == 'true' && needs.setup.outputs.preview_only == 'false' && needs.pre-publish-check.result == 'success'
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install twine
        run: pip install twine
      # Publish the wheel exactly as built by the `package-sdk-python` job
      # (`make dist`, which bundles both the Linux .so and macOS .dylib).
      # `make publish` uploads this artifact as-is — it does not rebuild — so
      # the generated sources and native binaries are intentionally NOT
      # re-downloaded here. The Makefile is the source of truth for what ships.
      - name: Download SDK artifacts
        uses: actions/download-artifact@v4
        with:
          name: sdk-python
          path: artifacts/sdk-python
      - name: Check what will be published (Python)
        run: |
          echo "=== Python SDK Publication Preview ==="
          echo "Wheel location: artifacts/sdk-python/"
          ls -la artifacts/sdk-python/
          echo ""
          echo "Per-wheel native library (one arch each):"
          for whl in artifacts/sdk-python/*.whl; do
            echo "  $whl"
            unzip -l "$whl" | grep -E '\.(so|dylib)' || echo "    (no native lib!)"
          done
          echo ""
          if [ "${{ inputs.preview_only }}" == "true" ]; then
            echo "⚠️ PREVIEW ONLY MODE - Skipping actual publish"
          else
            echo "✅ Will publish to PyPI"
          fi
      - name: Publish to PyPI
        if: ${{ needs.setup.outputs.preview_only == 'false' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: make -C sdk/python publish

  publish-javascript:
    name: Publish JavaScript SDK to npm
    runs-on: ubuntu-latest
    needs: [setup, preview-publish, pre-publish-check]
    if: always() && needs.setup.outputs.publish_javascript == 'true' && needs.setup.outputs.preview_only == 'false' && needs.pre-publish-check.result == 'success'
    # Must match the Environment of the npm trusted publisher: the OIDC token
    # only carries the `production` environment claim when the job runs in this
    # environment, and npm requires it to match the registered trusted publisher.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # Node 24 ships npm >= 11.x; OIDC trusted publishing requires npm >= 11.5.1.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify npm supports trusted publishing
        run: |
          echo "npm $(npm --version) / node $(node --version)"
          npx --yes semver -r '>=11.5.1' "$(npm --version)" >/dev/null \
            || { echo "npm >= 11.5.1 required for OIDC trusted publishing"; exit 1; }
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Only the prebuilt tarball is needed — publish uploads it as-is (the
      # native libs and generated sources are already bundled inside it).
      - name: Download SDK artifacts
        uses: actions/download-artifact@v4
        with:
          name: sdk-javascript
          path: artifacts/sdk-javascript
      - name: Check what will be published (JavaScript)
        run: |
          echo "=== JavaScript SDK Publication Preview ==="
          echo "Package location: artifacts/sdk-javascript/"
          ls -la artifacts/sdk-javascript/
          echo ""
          echo "Package contents preview:"
          tar -tzf artifacts/sdk-javascript/*.tgz | head -30
          echo ""
          echo "package.json:"
          tar -xzf artifacts/sdk-javascript/*.tgz -O package/package.json | head -30
          echo ""
          if [ "${{ inputs.preview_only }}" == "true" ]; then
            echo "⚠️ PREVIEW ONLY MODE - Skipping actual publish"
          else
            echo "✅ Will publish to npm"
          fi
      # Trusted publishing (OIDC): with id-token:write, the `production`
      # environment, and a matching trusted publisher on npmjs.com (repo
      # juspay/hyperswitch-prism, workflow release-sdks.yml, env production),
      # npm mints its own short-lived credential — no NODE_AUTH_TOKEN.
      # Provenance is attached automatically. Requires npm >= 11.5.1 (Node 24).
      - name: Publish to npm
        if: ${{ needs.setup.outputs.preview_only == 'false' }}
        working-directory: sdk/javascript
        run: |
          npm ci
          npm publish ../../artifacts/sdk-javascript/*.tgz --access public
