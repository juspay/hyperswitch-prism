name: Release medusa-custom-payments-react

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      preview_only:
        description: 'Preview only (do not actually publish)'
        required: false
        default: false
        type: boolean
      publish_npm:
        description: 'Publish to npm'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    if: ${{ inputs.version_bump != 'none' && inputs.preview_only == false }}
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump package version
        id: bump
        run: |
          OLD_VERSION=$(node -p "require('./plugins/medusa/medusa-custom-payments-react/package.json').version")
          (cd plugins/medusa/medusa-custom-payments-react && npm version ${{ inputs.version_bump }} --no-git-tag-version)
          NEW_VERSION=$(node -p "require('./plugins/medusa/medusa-custom-payments-react/package.json').version")
          echo "old_version=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          git add plugins/medusa/medusa-custom-payments-react/package.json
          git commit -m "medusa-custom-payments-react-v${NEW_VERSION}"
          git tag "medusa-custom-payments-react-v${NEW_VERSION}"

      - name: Push version bump and tag
        id: push
        run: |
          git push --follow-tags
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Version bump summary
        run: |
          echo "✅ Version bumped from ${{ steps.bump.outputs.old_version }} to ${{ steps.bump.outputs.new_version }}"

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [bump-version]
    if: always() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build
        run: |
          cd plugins/medusa/medusa-custom-payments-react
          npm install
          npm run build

      - name: Verify build output
        run: |
          echo "Verifying build artifacts..."
          test -f plugins/medusa/medusa-custom-payments-react/dist/index.js  || (echo "❌ plugins/medusa/medusa-custom-payments-react/dist/index.js not found"  && exit 1)
          test -f plugins/medusa/medusa-custom-payments-react/dist/index.mjs || (echo "❌ plugins/medusa/medusa-custom-payments-react/dist/index.mjs not found" && exit 1)
          test -f plugins/medusa/medusa-custom-payments-react/dist/index.d.ts || (echo "❌ plugins/medusa/medusa-custom-payments-react/dist/index.d.ts not found" && exit 1)
          echo "✅ Build output verified"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medusa-custom-payments-react-dist
          path: plugins/medusa/medusa-custom-payments-react/dist/

  package:
    name: Package for npm
    runs-on: ubuntu-latest
    needs: [build, bump-version]
    if: always() && needs.build.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: medusa-custom-payments-react-dist
          path: plugins/medusa/medusa-custom-payments-react/dist/

      - name: Create npm package tarball
        run: |
          cd plugins/medusa/medusa-custom-payments-react
          cp ../../../LICENSE LICENSE
          npm install --ignore-scripts
          npm pack

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: medusa-custom-payments-react-tarball
          path: 'plugins/medusa/medusa-custom-payments-react/*.tgz'

  preview:
    name: Preview What Will Be Published
    runs-on: ubuntu-latest
    needs: [package]
    if: always() && needs.package.result == 'success'
    steps:
      - name: Download package tarball
        uses: actions/download-artifact@v4
        with:
          name: medusa-custom-payments-react-tarball

      - name: Show Preview
        run: |
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║        📦 PACKAGE PUBLICATION PREVIEW                          ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Package tarball:"
          ls -la *.tgz 2>/dev/null || echo "  ❌ No tarball found"
          echo ""
          echo "Package contents preview:"
          tar -tzf *.tgz | head -40
          echo ""
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          if [ "${{ inputs.preview_only }}" == "true" ]; then
            echo "⚠️  PREVIEW ONLY MODE - Package will not be published"
          elif [ "${{ inputs.publish_npm }}" == "true" ]; then
            echo "✅ Package will be published to npm"
          else
            echo "ℹ️  Publishing not enabled (publish_npm not checked)"
          fi
          echo ""
          echo "═══════════════════════════════════════════════════════════════════"

  pre-publish-check:
    name: Pre-Publish Validation
    runs-on: ubuntu-latest
    needs: [package]
    if: always() && needs.package.result == 'success' && (inputs.preview_only == true || inputs.publish_npm == true)
    # id-token so the auth check can verify OIDC issuance pre-flight.
    permissions:
      contents: read
      id-token: write
    steps:
      # Node 24 ships npm 11.x; npm >= 11.5.1 is required for OIDC trusted
      # publishing. Kept in step with the publish job so the dry-run exercises
      # the same npm.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download package tarball
        uses: actions/download-artifact@v4
        with:
          name: medusa-custom-payments-react-tarball

      # There is no stored npm token to check `npm whoami` against any more. The
      # publish credential is minted from the GitHub OIDC token at publish time,
      # so the pre-flight equivalent is confirming this run can mint one. It
      # cannot verify the trusted-publisher config on npmjs.com.
      - name: Check npm authentication (OIDC)
        id: check-npm-auth
        continue-on-error: true
        run: |
          echo "Checking OIDC token issuance..."
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "❌ No OIDC token endpoint — job is missing 'id-token: write'"
            exit 1
          fi
          token="$(curl -sf \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | jq -r '.value // empty')"
          if [ -z "$token" ]; then
            echo "❌ Failed to mint an OIDC token for npm"
            exit 1
          fi
          echo "✅ OIDC token minted for npm"

      - name: Check version availability
        id: check-version
        continue-on-error: true
        run: |
          echo "Checking if version already exists on npm..."
          tar -xf *.tgz package/package.json
          VERSION=$(node -p "require('./package/package.json').version")
          NAME=$(node -p "require('./package/package.json').name")
          echo "Package: $NAME, Version: $VERSION"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "❌ Version $VERSION already exists on npm"
            exit 1
          else
            echo "✅ Version $VERSION is available for publish"
          fi

      - name: Dry-run publish check
        id: check-dryrun
        continue-on-error: true
        run: |
          echo "Running npm publish --dry-run..."
          npm publish *.tgz --dry-run

      - name: Pre-Publish Check Summary
        run: |
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║        📋 PRE-PUBLISH CHECK SUMMARY                            ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          auth="${{ steps.check-npm-auth.outcome }}"
          ver="${{ steps.check-version.outcome }}"
          dry="${{ steps.check-dryrun.outcome }}"

          FAILED=0
          echo "Checks:"
          echo "  npm auth:      $auth"
          echo "  version check: $ver"
          echo "  dry-run:       $dry"
          echo ""

          if [ "$auth" == "failure" ] || [ "$ver" == "failure" ] || [ "$dry" == "failure" ]; then
            echo "❌ One or more pre-publish checks FAILED"
            FAILED=1
          else
            echo "✅ All pre-publish checks PASSED"
          fi
          echo ""

          if [ "${{ inputs.publish_npm }}" == "true" ] && [ "$FAILED" -eq 1 ]; then
            echo "Publishing will be BLOCKED due to failed checks."
            exit 1
          fi
          echo "═══════════════════════════════════════════════════════════════════"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [preview, pre-publish-check]
    if: always() && needs.preview.result == 'success' && needs.pre-publish-check.result == 'success' && inputs.publish_npm == true && inputs.preview_only == false
    # Must match the Environment field of the trusted publisher on npmjs.com —
    # declaring it here is what puts the "production" claim in the OIDC token.
    # Note this job runs on the dispatched branch, not on the medusa-*-v* tag
    # created by bump-version, so `production` must admit that branch.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      # Node 24 ships npm 11.x. npm >= 11.5.1 is required for OIDC trusted
      # publishing; registry-url writes the .npmrc that scopes the OIDC exchange
      # to registry.npmjs.org.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm supports trusted publishing
        run: |
          echo "npm $(npm --version) / node $(node --version)"
          npx --yes semver -r '>=11.5.1' "$(npm --version)" >/dev/null \
            || { echo "npm >= 11.5.1 required for OIDC trusted publishing"; exit 1; }

      - name: Download package tarball
        uses: actions/download-artifact@v4
        with:
          name: medusa-custom-payments-react-tarball

      - name: Check what will be published
        run: |
          echo "=== Publication Preview ==="
          echo "Package tarball:"
          ls -la *.tgz
          echo ""
          echo "Package contents:"
          tar -tzf *.tgz | head -30
          echo ""

      # Publishes via OIDC trusted publishing — no stored token. Requires the
      # job's id-token: write above, npm >= 11.5.1, and a trusted publisher
      # registered on npmjs.com for this package pointing at
      # release-medusa-custom-payments-react.yml. Provenance is automatic.
      - name: Publish to npm
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          echo "Publishing package..."
          npm publish *.tgz --access public
          echo "✅ Package published successfully"
