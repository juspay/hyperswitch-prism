name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# Job dependency graph:
#
#   changes ─┬─ typos              (always, ~8s)
#            ├─ auto-fix           (PR only: format + generate + docs → bot commit if needed)
#            │   ├─ check          (if rust changed AND auto-fix didn't push, ~11min)
#            │   ├─ test           (parallel with check, ~15min)
#            │   └─ sdk-test       (if sdk/rust-core/proto changed: FFI+gRPC tests, ~25min)
#            └─ ci-gate            (always — single required status check)
#
# Auto-fix runs first on PRs: formats code + generates docs. If changes are
# found, it commits them and the remaining jobs SKIP (a new CI run triggers
# on the bot commit with clean code). If no changes needed, checks proceed.
# check and test run in PARALLEL with separate caches (faster wall clock).
# sdk-test runs FFI and gRPC tests sequentially in one job: ffi binaries are
# built first so Cargo caches external-services (no injector-client), then
# grpc-server is built (with injector-client) as a separate artifact — no
# recompile when switching between test suites.
# For connector-only PRs, tests are scoped to changed connectors.
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── Change Detection ──────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust-core: ${{ steps.filter.outputs.rust-core }}
      connector: ${{ steps.filter.outputs.connector }}
      any-rust: ${{ steps.filter.outputs.any-rust }}
      sdk: ${{ steps.filter.outputs.sdk }}
      proto: ${{ steps.filter.outputs.proto }}
      docs-trigger: ${{ steps.filter.outputs.docs-trigger }}
      stripe: ${{ steps.filter.outputs.stripe }}
      any-rs: ${{ steps.filter.outputs.any-rs }}
      ci: ${{ steps.filter.outputs.ci }}
      certification-inputs: ${{ steps.filter.outputs.certification-inputs }}
      connector-names: ${{ steps.connector-names.outputs.list }}
      new-connectors: ${{ steps.new-connectors.outputs.list }}
      spec-modified-connectors: ${{ steps.spec-modified-connectors.outputs.list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: json
          filters: |
            rust-core:
              - 'crates/common/**'
              - 'crates/types-traits/**'
              - 'crates/grpc-server/**'
              - 'crates/ffi/**'
              - 'crates/internal/composite-service/**'
              - 'crates/internal/field-probe/**'
              - 'crates/internal/uniffi-bindgen/**'
              - 'crates/internal/integration-tests/src/harness/**'
              - 'crates/internal/integration-tests/src/global_suites/**'
              - 'crates/internal/integration-tests/src/lib.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
            connector:
              - 'crates/integrations/**'
              - 'crates/internal/integration-tests/src/connector_specs/**'
            any-rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'config/**'
            sdk:
              - 'sdk/**'
              - 'crates/ffi/**'
            proto:
              - 'crates/types-traits/grpc-api-types/proto/**'
            docs-trigger:
              - 'crates/integrations/**'
              - 'crates/types-traits/**'
              - 'crates/internal/field-probe/**'
              - 'docs/**'
              - 'docs-generated/**'
              - 'examples/**'
              - 'scripts/**'
            stripe:
              - 'crates/integrations/connector-integration/src/connectors/stripe.rs'
              - 'crates/integrations/connector-integration/src/connectors/stripe/**'
              - 'crates/internal/integration-tests/src/connector_specs/stripe/**'
            any-rs:
              - '**/*.rs'
            ci:
              - '.github/**'
            # Read at run time by certification; they match no connector path.
            # Separate from rust-core, which seven other jobs also gate on.
            certification-inputs:
              - 'crates/internal/connector-creds/**'
              - 'crates/internal/integration-tests/src/bin/**'
              - 'crates/internal/integration-tests/src/webhook_signatures.rs'
              - 'scripts/**'
              - 'config/**'
              - '.github/scripts/**'
              # Shared connector code: no connector name in the path, so nothing
              # would be selected. `*` stops at the slash, sparing connectors/.
              - 'crates/integrations/connector-integration/src/*.rs'
      - name: Extract changed connector names
        id: connector-names
        if: steps.filter.outputs.connector == 'true'
        shell: bash
        # Expressions reach bash through the environment, never spliced into the
        # script: connector_files carries attacker-chosen file names on a fork PR,
        # and one apostrophe in a path would end the quoting and run the rest.
        env:
          CONNECTOR_FILES: ${{ steps.filter.outputs.connector_files }}
          # merge_group has no pull_request and no `before` — it diffs a
          # synthetic batch commit, so its own base_sha (the target branch's
          # tip before the queued batch) is the only correct base here.
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          alpha=crates/internal/integration-tests/src/connector_specs/alpha_connectors.json
          live=crates/internal/integration-tests/src/connector_specs/live_connectors.json
          base_ref="${BASE_REF}"
          if [[ -z "${base_ref}" ]]; then
            echo "::error::BASE_REF resolved empty — none of pull_request.base.sha, merge_group.base_sha, or event.before matched this trigger. Diffing against nothing would silently misreport every connector as changed."
            exit 1
          fi

          touched=$(echo "${CONNECTOR_FILES}" | \
            jq -r '.[]' | \
            grep -oE '(connectors|connector_specs)/[^/]+' | \
            sed 's|^connectors/||;s|^connector_specs/||;s|\.rs$||' | \
            grep -v -E '^(alpha_connectors|live_connectors)\.json$')

          # Taking a connector off the alpha list is what starts certifying it,
          # but the edit touches only that shared file. Names present at the
          # merge base and gone now are the ones being promoted.
          promoted=""
          if [ -f "$alpha" ]; then
            promoted=$(comm -23 \
              <(git show "$base_ref:$alpha" 2>/dev/null | jq -r '.connectors | keys[]') \
              <(jq -r '.connectors | keys[]' "$alpha"))
          fi

          # Same idea for live_connectors.json: a connector added there starts
          # being swept in on every shared-code change, but the edit touches
          # only that shared file, not the connector's own spec_dir.
          newly_live=""
          if [ -f "$live" ]; then
            newly_live=$(comm -13 \
              <(git show "$base_ref:$live" 2>/dev/null | jq -r '.connectors | keys[]') \
              <(jq -r '.connectors | keys[]' "$live"))
          fi

          names=$(printf '%s\n%s\n%s\n' "$touched" "$promoted" "$newly_live" | sed '/^$/d' | sort -u | paste -sd ',' -)
          echo "list=$names" >> $GITHUB_OUTPUT
          echo "Changed connectors: $names"

      - name: Detect newly added connectors
        id: new-connectors
        if: steps.connector-names.outputs.list != ''
        shell: bash
        env:
          CHANGED_LIST: ${{ steps.connector-names.outputs.list }}
          # merge_group has no pull_request and no `before` — it diffs a
          # synthetic batch commit, so its own base_sha (the target branch's
          # tip before the queued batch) is the only correct base here.
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          base_ref="${BASE_REF}"
          if [[ -z "${base_ref}" ]]; then
            echo "::error::BASE_REF resolved empty — none of pull_request.base.sha, merge_group.base_sha, or event.before matched this trigger. Diffing against nothing would silently misreport every connector as changed."
            exit 1
          fi
          new_list=""
          IFS=',' read -ra CONNECTORS <<< "${CHANGED_LIST}"
          for c in "${CONNECTORS[@]}"; do
            spec_dir="crates/internal/integration-tests/src/connector_specs/$c"
            # A connector is "new" in this PR if its spec directory does not
            # exist at the PR's base commit, regardless of whether it exists
            # now. Compares against the merge-base, not just the immediate
            # parent, so it's correct for PRs with multiple commits.
            if ! git cat-file -e "${base_ref}:${spec_dir}" 2>/dev/null; then
              new_list="${new_list}${new_list:+,}${c}"
            fi
          done
          echo "list=$new_list" >> $GITHUB_OUTPUT
          echo "Newly added connectors: $new_list"

      - name: Detect connectors with a modified specs.json or override.json
        id: spec-modified-connectors
        if: steps.connector-names.outputs.list != ''
        shell: bash
        env:
          CHANGED_LIST: ${{ steps.connector-names.outputs.list }}
          # merge_group has no pull_request and no `before` — it diffs a
          # synthetic batch commit, so its own base_sha (the target branch's
          # tip before the queued batch) is the only correct base here.
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          alpha=crates/internal/integration-tests/src/connector_specs/alpha_connectors.json
          live=crates/internal/integration-tests/src/connector_specs/live_connectors.json
          base_ref="${BASE_REF}"
          if [[ -z "${base_ref}" ]]; then
            echo "::error::BASE_REF resolved empty — none of pull_request.base.sha, merge_group.base_sha, or event.before matched this trigger. Diffing against nothing would silently misreport every connector as changed."
            exit 1
          fi
          modified_list=""

          # Promoted off the alpha list, or newly added to the live list: the
          # edit lives in a shared file, not the connector's own spec_dir, so
          # a content diff on specs.json/override.json below would find
          # nothing — the connector is newly exposed to certification (or, for
          # the live list, to the shared-code sweep) regardless of whether its
          # own files changed at all.
          if [ -f "$alpha" ]; then
            while IFS= read -r c; do
              [ -n "$c" ] || continue
              modified_list="${modified_list}${modified_list:+,}${c}"
            done < <(comm -23 \
              <(git show "$base_ref:$alpha" 2>/dev/null | jq -r '.connectors | keys[]') \
              <(jq -r '.connectors | keys[]' "$alpha"))
          fi
          if [ -f "$live" ]; then
            while IFS= read -r c; do
              [ -n "$c" ] || continue
              modified_list="${modified_list}${modified_list:+,}${c}"
            done < <(comm -13 \
              <(git show "$base_ref:$live" 2>/dev/null | jq -r '.connectors | keys[]') \
              <(jq -r '.connectors | keys[]' "$live"))
          fi

          IFS=',' read -ra CONNECTORS <<< "${CHANGED_LIST}"
          for c in "${CONNECTORS[@]}"; do
            spec_dir="crates/internal/integration-tests/src/connector_specs/$c"
            # A newly added connector has no merge-base content to diff against
            # and is already held to a stricter bar by verify-new-connectors.sh
            # (every failure attributable, no arbitration at all) — skip it here
            # so certify-connectors.sh does not have to reconcile two different
            # "no escape hatch" reasons for the same connector.
            if ! git cat-file -e "${base_ref}:${spec_dir}" 2>/dev/null; then
              continue
            fi
            for f in specs.json override.json; do
              path="${spec_dir}/${f}"
              [ -f "${path}" ] || continue
              # Compares file content, not merely "did this path appear in the
              # diff" — a connector's specs.json can be untouched even though
              # the connector name is in CHANGED_LIST because a *different*
              # file for the same connector (e.g. a transformer .rs) changed.
              if ! git diff --quiet "${base_ref}" HEAD -- "${path}" 2>/dev/null; then
                modified_list="${modified_list}${modified_list:+,}${c}"
                break
              fi
            done
          done

          modified_list=$(echo "$modified_list" | tr ',' '\n' | sed '/^$/d' | sort -u | paste -sd ',' -)
          echo "list=$modified_list" >> $GITHUB_OUTPUT
          echo "Connectors with a modified specs.json/override.json, promoted off alpha, or newly live: $modified_list"


  # ── Fast Checks ───────────────────────────────────────────────────────────

  typos:
    name: Spell check
    if: "!github.event.pull_request.draft"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Spell check
        uses: crate-ci/typos@master
        with:
          config: ./.typos.toml

  clippy:
    name: Clippy check
    needs: changes
    if: "!github.event.pull_request.draft && (needs.changes.outputs.any-rust == 'true' || needs.changes.outputs.proto == 'true')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: "ci-clippy"

      - name: Run Clippy
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo +stable clippy --all-features --all-targets --profile release-fast

  # ── Auto-fix (formatting + docs) ─────────────────────────────────────────
  # On PRs: auto-format code and regenerate docs, commit if changes found.
  # If a commit is pushed, remaining jobs skip — the new push triggers fresh CI.
  # On push/merge_group: not applicable (code should already be clean from PR).
  auto-fix:
    name: Auto-fix (format + docs + generate)
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
      (needs.changes.outputs.any-rs == 'true' ||
       needs.changes.outputs.docs-trigger == 'true' ||
       needs.changes.outputs.sdk == 'true' ||
       needs.changes.outputs.proto == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - name: Generate bot token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HYPERSWITCH_BOT_APP_ID }}
          private-key: ${{ secrets.HYPERSWITCH_BOT_APP_PRIVATE_KEY }}

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.generate_token.outputs.token }}

      - name: Install Rust (nightly for fmt)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Set stable as default toolchain
        run: rustup default stable

      - uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: "ci-release-fast"
          cache-targets: true

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/javascript/package-lock.json

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install jinja2 google-cloud-vision python-dotenv requests types-requests grpcio-tools mypy

      - name: Install SDK codegen dependencies
        run: |
          pip install -r sdk/python/requirements.txt grpcio-tools protobuf
          make -C sdk install-deps
          cd sdk/javascript && npm ci && cd ../..

      - name: Format Rust code
        run: cargo +nightly fmt --all

      - name: Generate SDK bindings
        env:
          RUSTUP_TOOLCHAIN: stable
        run: make -C sdk generate PROFILE=release-fast

      - name: Restore docs binaries cache
        id: field-probe-cache-restore
        if: needs.changes.outputs.docs-trigger == 'true' || needs.changes.outputs.ci == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            target/x86_64-unknown-linux-gnu/release-fast/field-probe
            target/x86_64-unknown-linux-gnu/release-fast/libconnector_service_ffi.so
            target/x86_64-unknown-linux-gnu/release-fast/uniffi-bindgen
          key: docs-binaries-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'crates/**/*.rs', 'crates/**/*.proto') }}

      - name: Build field-probe + FFI + uniffi-bindgen (cache miss)
        if: >-
          (needs.changes.outputs.docs-trigger == 'true' || needs.changes.outputs.ci == 'true') &&
          steps.field-probe-cache-restore.outputs.cache-hit != 'true'
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          cargo build -p field-probe -p ffi -p uniffi-bindgen \
            --target x86_64-unknown-linux-gnu --profile release-fast

      - name: Save docs binaries cache
        if: >-
          (needs.changes.outputs.docs-trigger == 'true' || needs.changes.outputs.ci == 'true') &&
          steps.field-probe-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/x86_64-unknown-linux-gnu/release-fast/field-probe
            target/x86_64-unknown-linux-gnu/release-fast/libconnector_service_ffi.so
            target/x86_64-unknown-linux-gnu/release-fast/uniffi-bindgen
          key: docs-binaries-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'crates/**/*.rs', 'crates/**/*.proto') }}

      - name: Generate UniFFI Kotlin bindings
        if: needs.changes.outputs.docs-trigger == 'true' || needs.changes.outputs.ci == 'true'
        env:
          RUSTUP_TOOLCHAIN: stable
        run: make -C sdk/java generate-bindings PROFILE=release-fast

      - name: Publish Java SDK to Maven Local
        if: needs.changes.outputs.docs-trigger == 'true' || needs.changes.outputs.ci == 'true'
        run: cd sdk/java && ./gradlew publishToMavenLocal -q

      - name: Generate documentation
        if: needs.changes.outputs.docs-trigger == 'true' || needs.changes.outputs.ci == 'true'
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          ./target/x86_64-unknown-linux-gnu/release-fast/field-probe || true
          make docs SKIP_PROBE=1

      - name: Check for changes and commit
        id: commit
        run: |
          git config user.name 'hyperswitch-bot[bot]'
          git config user.email '148525504+hyperswitch-bot[bot]@users.noreply.github.com'

          git add -A

          if git diff --cached --quiet; then
            echo "✅ No auto-fix changes needed"
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            echo "📝 Auto-fix changes detected:"
            git diff --cached --stat

            git commit -m "chore: auto-fix formatting and generated code

          Auto-applied by CI:
          - cargo +nightly fmt --all
          - make -C sdk generate (if applicable)
          - make docs (if applicable)

          This commit was automatically generated by GitHub Actions."

            git push
            echo "✅ Auto-fix committed — new CI run will trigger on clean code"
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

  # ── Formatting Check (non-PR events only) ──────────────────────────────
  # On push/merge_group, auto-fix doesn't run (no PR branch to commit to).
  # This lightweight check ensures unformatted code never lands on main.
  formatting:
    name: Check formatting
    needs: changes
    if: >-
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.any-rs == 'true' ||
       needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --all --check

  # ── Compilation & Lint ────────────────────────────────────────────────────

  check:
    name: Compilation Check
    needs: [changes, auto-fix]
    # Run if rust/proto/CI files changed AND auto-fix succeeded without pushing.
    # Skip if auto-fix pushed (new CI run incoming) or if auto-fix failed.
    # 'success() || skipped' handles non-PR events where auto-fix is skipped.
    if: >-
      !github.event.pull_request.draft &&
      (success() || needs.auto-fix.result == 'skipped') &&
      needs.auto-fix.outputs.pushed != 'true' &&
      (needs.changes.outputs.any-rust == 'true' ||
       needs.changes.outputs.proto == 'true' ||
       needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest

    env:
      RUSTFLAGS: "-D warnings"
      # Same as the test job: minimal debug info keeps target/ within the hosted
      # runner's disk when a base-crate change forces a full-workspace rebuild.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: "ci-rust"

      - name: Run Composite Request Schema Checks
        run: cargo test -p composite-service --all-features --test composite_request_schema_check

      - name: Run UCS Connector Schema Compatibility Check
        run: cargo test -p integration-tests --all-features --lib harness::scenario_api::tests::all_supported_scenarios_match_proto_schema_for_all_connectors -- --exact

      - name: Run Connector Specs Coverage Check
        run: cargo run --all-features --bin check_connector_specs

      - name: Run Superposition Config Validation
        run: cargo test -p grpc-server --all-features --test test_superposition_config

  # ── Tests ─────────────────────────────────────────────────────────────────

  test:
    name: Run Tests
    needs: [changes, auto-fix]
    # Run if rust/proto/CI files changed AND auto-fix succeeded without pushing.
    # Skip if auto-fix pushed (new CI run incoming) or if auto-fix failed.
    if: >-
      !github.event.pull_request.draft &&
      (success() || needs.auto-fix.result == 'skipped') &&
      needs.auto-fix.outputs.pushed != 'true' &&
      (needs.changes.outputs.any-rust == 'true' ||
       needs.changes.outputs.proto == 'true' ||
       needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest

    env:
      RUSTFLAGS: "-D warnings"
      # Compile test artifacts with minimal debug info (line tables only) to keep
      # target/ small enough for the hosted runner's disk on the full-workspace
      # build. Keeps file:line in panic backtraces; just much smaller .rlibs.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
      RUN_TESTS: ${{ (github.event_name == 'push') || ((github.event_name == 'pull_request') && (github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name)) || (github.event_name == 'merge_group') }}

    steps:
      - name: Skip tests for PRs from forks
        if: ${{ env.RUN_TESTS == 'false' }}
        shell: bash
        run: echo 'Skipping tests for PRs from forks'

      - name: Checkout code
        if: ${{ env.RUN_TESTS == 'true' }}
        uses: actions/checkout@v4

      - name: Install Rust
        if: ${{ env.RUN_TESTS == 'true' }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install Protoc
        if: ${{ env.RUN_TESTS == 'true' }}
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2.7.8
        if: ${{ env.RUN_TESTS == 'true' }}
        with:
          shared-key: "ci-rust"

      - name: Install nextest
        if: ${{ env.RUN_TESTS == 'true' }}
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
          checksum: true

      - name: Download Encrypted Connector Credentials from S3 and Decrypt
        if: ${{ env.RUN_TESTS == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CONNECTOR_CREDS_AWS_ACCESS_KEY_ID }}
          AWS_REGION: ${{ secrets.CONNECTOR_CREDS_AWS_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CONNECTOR_CREDS_AWS_SECRET_ACCESS_KEY }}
          CONNECTOR_AUTH_PASSPHRASE: ${{ secrets.CONNECTOR_AUTH_PASSPHRASE }}
          CONNECTOR_CREDS_S3_BUCKET_URI: ${{ secrets.CONNECTOR_CREDS_S3_BUCKET_URI}}
          DESTINATION_FILE_NAME: "creds.json.gpg"
          # Proto-native ConnectorSpecificConfig shape — the same file the
          # connector-service report pipeline reads. Both consumers now expect
          # it: the harness loader, and the grpc-server tests via
          # credential_utils, which forward it as x-connector-config.
          S3_SOURCE_FILE_NAME: "c66ba935-61a1-4a96-95cf-5ee5120813a3.json.gpg"
        shell: bash
        run: |
          mkdir -p ".github/secrets" ".github/test"

          aws s3 cp "${CONNECTOR_CREDS_S3_BUCKET_URI}/${S3_SOURCE_FILE_NAME}" ".github/secrets/${DESTINATION_FILE_NAME}"
          gpg --quiet --batch --yes --decrypt --passphrase="${CONNECTOR_AUTH_PASSPHRASE}" --output ".github/test/creds.json" ".github/secrets/${DESTINATION_FILE_NAME}"

      - name: Set connector credentials path in environment
        if: ${{ env.RUN_TESTS == 'true' }}
        shell: bash
        run: |
          # Missing credentials are fatal to certification but not to the unit
          # tests in this job, so this does not fail here — the certification
          # steps below fail instead, and only when they were actually selected.
          # An S3 or GPG hiccup must not take down CI for every open PR.
          if [[ -f ".github/test/creds.json" ]]; then
            echo "CONNECTOR_AUTH_FILE_PATH=${{ github.workspace }}/.github/test/creds.json" >> $GITHUB_ENV
            echo "Connector credentials available for tests"
          else
            echo "::warning::No connector credentials available — live certification cannot run"
          fi

      - name: Free up disk space
        if: ${{ env.RUN_TESTS == 'true' }}
        run: |
          echo "Before cleanup:"
          df -h
          du -sh target 2>/dev/null || echo "No target dir"
          # Aggressive target cleanup - keep only essentials
          rm -rf target/debug
          rm -rf target/incremental
          find target -name "*.rlib" -size +50M -delete 2>/dev/null || true
          # System cleanup
          sudo apt-get clean
          sudo rm -rf /var/cache/apt/archives
          npm cache clean --force 2>/dev/null || true
          echo "After cleanup:"
          df -h
          du -sh target 2>/dev/null || echo "No target dir"

      - name: Run Tests
        if: ${{ env.RUN_TESTS == 'true' }}
        shell: bash
        run: |
          CONNECTOR_NAMES="${{ needs.changes.outputs.connector-names }}"
          CORE_CHANGED="${{ needs.changes.outputs.rust-core }}"
          PROTO_CHANGED="${{ needs.changes.outputs.proto }}"
          CI_CHANGED="${{ needs.changes.outputs.ci }}"

          SCHEMA_EXCLUDE='not test(=all_supported_scenarios_match_proto_schema_for_all_connectors)'

          # Scoped tests only on pull_request for connector-only changes.
          # push (main) and merge_group always run the full suite as a safety net.
          EVENT="${{ github.event_name }}"

          if [[ "$EVENT" == "pull_request" && -n "$CONNECTOR_NAMES" && "$CORE_CHANGED" != "true" && "$PROTO_CHANGED" != "true" && "$CI_CHANGED" != "true" ]]; then
            FILTER=""
            IFS=',' read -ra CONNECTORS <<< "$CONNECTOR_NAMES"
            for c in "${CONNECTORS[@]}"; do
              [[ -n "$FILTER" ]] && FILTER="$FILTER | "
              FILTER="${FILTER}test(/${c}/)"
            done
            echo "🔍 Connector-only PR — scoping tests to: $CONNECTOR_NAMES"
            cargo nextest run \
              --features grpc-server/connector-request-kafka,grpc-server/log-transformations \
              --config-file .nextest.toml \
              --profile ci \
              --no-tests=warn \
              -E "($FILTER) & ($SCHEMA_EXCLUDE)"
          else
            echo "🔍 Running full test suite (event=$EVENT)"
            cargo nextest run \
              --features grpc-server/connector-request-kafka,grpc-server/log-transformations \
              --config-file .nextest.toml \
              --profile ci \
              -E "$SCHEMA_EXCLUDE"
          fi

      # Certification calls each selected connector's live sandbox for real.
      # The gRPC call itself takes seconds; the cost is building the binaries,
      # so both are built once here with the same features the test run above
      # used, and the certification steps reuse them via `--no-build`.
      - name: Build certification binaries
        if: ${{ env.RUN_TESTS == 'true' && (needs.changes.outputs.connector == 'true' || needs.changes.outputs.rust-core == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.certification-inputs == 'true') }}
        shell: bash
        run: |
          cargo build --workspace --bins \
            --features grpc-server/connector-request-kafka,grpc-server/log-transformations

      # The test harness shells out to grpcurl to make the actual call.
      - name: Install grpcurl
        if: ${{ env.RUN_TESTS == 'true' && (needs.changes.outputs.connector == 'true' || needs.changes.outputs.rust-core == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.certification-inputs == 'true') }}
        shell: bash
        env:
          GRPCURL_VERSION: "1.9.3"
          GRPCURL_SHA256: "a926b62a85787ccf73ef8736b3ae554f1242e39d92bb8767a79d6dd23b11d1d5"
        run: |
          if command -v grpcurl >/dev/null 2>&1; then
            grpcurl --version
            exit 0
          fi
          curl -fsSL \
            "https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz" \
            -o /tmp/grpcurl.tar.gz
          echo "${GRPCURL_SHA256}  /tmp/grpcurl.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/grpcurl.tar.gz -C /tmp grpcurl
          sudo mv /tmp/grpcurl /usr/local/bin/grpcurl
          grpcurl --version

      - name: Verify newly added connectors' declared scenarios
        id: verify-new-connectors
        if: ${{ env.RUN_TESTS == 'true' && needs.changes.outputs.new-connectors != '' }}
        shell: bash
        env:
          NEW_CONNECTORS: ${{ needs.changes.outputs.new-connectors }}
          UNPROVEN_FILE: ${{ runner.temp }}/unproven.txt
        run: .github/scripts/verify-new-connectors.sh

      - name: Certify selected connectors
        if: ${{ env.RUN_TESTS == 'true' && (needs.changes.outputs.connector == 'true' || needs.changes.outputs.rust-core == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.certification-inputs == 'true') }}
        shell: bash
        env:
          # Git facts only. Which suites and scenarios each connector runs is the
          # framework's to derive from that connector's own specs.json.
          CHANGED_CONNECTORS: ${{ needs.changes.outputs.connector-names }}
          NEW_CONNECTORS: ${{ needs.changes.outputs.new-connectors }}
          SPEC_MODIFIED_CONNECTORS: ${{ needs.changes.outputs.spec-modified-connectors }}
          SHARED_CHANGED: ${{ needs.changes.outputs.rust-core == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.certification-inputs == 'true' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/certify-connectors.sh

      # Every request and response is already recorded per scenario; without this
      # the file dies with the runner and only the assertion text survives.
      - name: Upload certification reports
        if: ${{ always() && env.RUN_TESTS == 'true' && (needs.changes.outputs.connector == 'true' || needs.changes.outputs.rust-core == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.certification-inputs == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: certification-reports
          path: ${{ runner.temp }}/certify-*.json
          if-no-files-found: ignore
          retention-days: 2

      # A connector whose connector_specs/<name>/ directory did not exist at this
      # PR's base commit must prove itself on its own PR. Its specs.json states
      # what it supports in `supported_suites`.
      #
      # Every scenario of every declared suite runs against the sandbox and must
      # pass. Merging unproven is allowed but never silent: the connector is
      # listed in alpha_connectors.json with a reason, and appears in the job
      # summary and in a PR comment. It certifies once that entry is removed.
      - name: Comment unproven connector declarations on the PR
        if: ${{ github.event_name == 'pull_request' && steps.verify-new-connectors.outputs.unproven == 'true' }}
        uses: actions/github-script@v7
        env:
          UNPROVEN_FILE: ${{ runner.temp }}/unproven.txt
        with:
          script: |
            const fs = require('fs');
            const lines = fs.readFileSync(process.env.UNPROVEN_FILE, 'utf8').trim().split('\n');
            const marker = '<!-- unproven-connectors -->';
            const body = [
              marker,
              '### ⚠️ Merging without live sandbox proof',
              '',
              ...lines.map(l => `- ${l}`),
              '',
              'These connectors are listed in `alpha_connectors.json`.',
              'No real sandbox call backs them. Confirm each stated reason before approving;',
              'they do not certify until the entry is removed.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = (await github.rest.issues.listComments({ owner, repo, issue_number }))
              .data.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # ── SDK Tests (FFI + gRPC) ────────────────────────────────────────────────
  # Builds all SDK binaries then runs gRPC tests first, followed by FFI tests
  # and mock tests. Running in a single job avoids the external-services feature
  # recompile that occurs when ffi (no injector-client) and grpc-server (with
  # injector-client) are built in separate jobs with separate Rust caches.
  # Build order: ffi first → grpc-server second, so Cargo stores both
  # external-services feature variants before any tests run.

  sdk-test:
    name: SDK Tests
    needs: [changes, auto-fix]
    if: >-
      !github.event.pull_request.draft &&
      (success() || needs.auto-fix.result == 'skipped') &&
      needs.auto-fix.outputs.pushed != 'true' &&
      (needs.changes.outputs.sdk == 'true' ||
       needs.changes.outputs.rust-core == 'true' ||
       needs.changes.outputs.proto == 'true' ||
       needs.changes.outputs.ci == 'true' ||
       needs.changes.outputs.stripe == 'true')
    runs-on: ubuntu-latest

    env:
      RUSTFLAGS: "-D warnings"
      PROFILE: release-fast

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            sdk/javascript/package-lock.json
            sdk/tests/package.json

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('sdk/python/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python codegen dependencies
        run: |
          pip install -r sdk/python/requirements.txt grpcio-tools protobuf
          make -C sdk install-deps

      - name: Install Node dependencies
        run: |
          cd sdk/javascript && npm ci && cd ../..
          cd sdk/tests && npm install && cd ../..

      - uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: "ci-release-fast"
          cache-targets: true

      - name: Generate flows.json
        run: python3 scripts/generators/code/generate.py --lang rust

      - name: Restore SDK binaries cache
        id: sdk-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            target/*/*/libconnector_service_ffi.so
            target/*/*/libconnector_service_ffi.dylib
            target/*/*/libhyperswitch_grpc_ffi.so
            target/*/*/libhyperswitch_grpc_ffi.dylib
            target/*/*/grpc-server
            target/*/*/uniffi-bindgen
            target/*/*/hyperswitch-smoke-test
            target/*/*/grpc-smoke-test
          key: sdk-${{ runner.os }}-${{ hashFiles('crates/ffi/**/*.rs', 'sdk/grpc-ffi/**/*.rs', 'crates/internal/uniffi-bindgen/**/*.rs', 'sdk/rust/smoke-test/**/*.rs', 'crates/grpc-server/**/*.rs', 'crates/types-traits/grpc-api-types/proto/**') }}

      - name: Build SDK binaries (cache miss)
        if: steps.sdk-cache-restore.outputs.cache-hit != 'true'
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          cargo build -p grpc-server -p hyperswitch-grpc-ffi -p ffi -p hyperswitch-smoke-test -p uniffi-bindgen \
            --profile release-fast --target x86_64-unknown-linux-gnu

      - name: Save SDK binaries cache
        if: steps.sdk-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/*/*/libconnector_service_ffi.so
            target/*/*/libconnector_service_ffi.dylib
            target/*/*/libhyperswitch_grpc_ffi.so
            target/*/*/libhyperswitch_grpc_ffi.dylib
            target/*/*/grpc-server
            target/*/*/uniffi-bindgen
            target/*/*/hyperswitch-smoke-test
            target/*/*/grpc-smoke-test
          key: sdk-${{ runner.os }}-${{ hashFiles('crates/ffi/**/*.rs', 'sdk/grpc-ffi/**/*.rs', 'crates/internal/uniffi-bindgen/**/*.rs', 'sdk/rust/smoke-test/**/*.rs', 'crates/grpc-server/**/*.rs', 'crates/types-traits/grpc-api-types/proto/**') }}

      - name: Create connector credentials
        shell: bash
        env:
          CONNECTOR_SPECIFIC_AUTH: ${{ secrets.CONNECTOR_SPECIFIC_AUTH }}
        run: |
          if [[ -n "${CONNECTOR_SPECIFIC_AUTH}" ]]; then
            echo "${CONNECTOR_SPECIFIC_AUTH}" > creds.json
            echo "Connector credentials created"
          else
            echo "No CONNECTOR_SPECIFIC_AUTH secret found, running in dry-run mode"
          fi

      - name: Run SDK gRPC Tests
        shell: bash
        run: |
          echo "Running SDK gRPC tests"
          GRPC_SKIP_BUILD=1 make -C sdk test-grpc PROFILE=release-fast

      - name: Run SDK FFI Tests
        shell: bash
        run: |
          if [[ -f "creds.json" ]]; then
            echo "Running SDK FFI tests with connector credentials"
          else
            echo "Running SDK FFI tests without connector credentials (dry-run mode)"
          fi
          FFI_SKIP_BUILD=1 make -C sdk test PROFILE=release-fast

      - name: Run SDK Mock Tests
        shell: bash
        run: |
          echo "Running SDK mock tests (no real HTTP calls)"
          python3 scripts/run_smoke_tests_parallel.py --mock --connectors stripe --sdks python,javascript,kotlin,rust

  # ── CI Gate ───────────────────────────────────────────────────────────────
  # Single required status check. Passes if all jobs succeeded, were skipped,
  # or if auto-fix pushed a commit (new CI run will validate clean code).
  ci-gate:
    name: CI Result
    if: always()
    needs: [typos, clippy, formatting, auto-fix, check, test, sdk-test]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI results
        run: |
          echo "Job results:"
          echo "  typos:         ${{ needs.typos.result }}"
          echo "  clippy:        ${{ needs.clippy.result }}"
          echo "  formatting:    ${{ needs.formatting.result }}"
          echo "  auto-fix:      ${{ needs.auto-fix.result }}"
          echo "  check:         ${{ needs.check.result }}"
          echo "  test:          ${{ needs.test.result }}"
          echo "  sdk-test:      ${{ needs.sdk-test.result }}"
          echo "  auto-fix pushed: ${{ needs.auto-fix.outputs.pushed }}"
          echo ""

          # If auto-fix pushed a commit, this run is stale — pass unconditionally.
          # The new CI run on the bot commit will validate everything.
          if [[ "${{ needs.auto-fix.outputs.pushed }}" == "true" ]]; then
            echo "✅ Auto-fix committed changes — new CI run will validate clean code"
            exit 0
          fi

          results=(
            "${{ needs.typos.result }}"
            "${{ needs.clippy.result }}"
            "${{ needs.formatting.result }}"
            "${{ needs.auto-fix.result }}"
            "${{ needs.check.result }}"
            "${{ needs.test.result }}"
            "${{ needs.sdk-test.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "❌ CI failed — one or more jobs returned: $result"
              exit 1
            fi
          done
          echo "✅ All CI checks passed (or were skipped due to path filtering)"
