name: Create a nightly tag

on:
  schedule:
    - cron: "0 0 * * 1-5" # Run workflow at 00:00 midnight UTC (05:30 AM IST) every Monday-Friday

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-nightly-tag:
    name: Create a nightly tag
    # Checkout and the commit/tag push authenticate with a hyperswitch-bot app
    # token minted inside the reusable workflow; `contents: read` is only so
    # that taiki-e/install-action can use GITHUB_TOKEN for its release downloads.
    permissions:
      contents: read
    uses: juspay/hyperswitch/.github/workflows/release-nightly-version-reusable.yml@main
    secrets:
      client_id: ${{ secrets.HYPERSWITCH_BOT_APP_ID }}
      app_private_key: ${{ secrets.HYPERSWITCH_BOT_APP_PRIVATE_KEY }}
