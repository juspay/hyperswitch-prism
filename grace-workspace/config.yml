# Byne pipeline configuration
# Fill in llm.baseUrl and llm.apiKey below, then start the engine with `pnpm dev`.

projectRoot: /Users/tushar.shukla/Downloads/Work/euler-ucs/hyperswitch-prism # target repo. Override per-machine with BYNE_PROJECT_ROOT env var (recommended).
# Absolute path to the connector creds.json. SessionManager symlinks this
# into every new session worktree so the grpc-server + agents find creds
# at <worktree>/creds.json without per-worktree copying. Override per-machine
# with BYNE_CREDS_PATH (recommended — keeps secrets out of this committed file).
# credsPath: /absolute/path/to/creds.json
devServerUrl: http://localhost:9000 # hyperswitch webpack-dev-server default
designMatchThreshold: 0.90
maxRetries: 3
dashboardPort: 3141
wsPort: 3142

opencode:
  # opencode CLI is used for L2 (research), L3, L4 and per-file implementation steps
  # so that the model can use tools (web_search, read_file, grep, write).
  # Model is left empty to use opencode default (kimi-latest)
  model: "" # Use opencode default model
  attachUrl: "http://127.0.0.1:4096" # running `opencode serve` instance
  timeoutMs: 900000 # per-call hard timeout (15 min)
  implementationConcurrency: 4

llm:
  # === FILL THESE IN ===
  baseUrl: "https://grid.ai.juspay.net/v1/chat/completions" # e.g. https://llm.yourhost.internal
  apiKey: "" # your hosted model API key
  model: "kimi-latest" # default model for all checkpoints

  # Per-checkpoint model overrides. Falls back to `model` when unset.
  # Use stronger models for steps that need repo reasoning or bulk code generation.
  models: {}
    # l3_gen: "claude-sonnet-4-6"
    # l4_gen: "claude-sonnet-4-6"
    # implementation: "claude-sonnet-4-6"

  # "openai"     -> POSTs to {baseUrl}/v1/chat/completions with {model, messages}
  # "anthropic"  -> POSTs to {baseUrl}/v1/messages            with {model, system, messages}
  protocol: openai

  maxTokens: 4000
  temperature: 0
  timeoutMs: 180000

  # Auth header customization. Defaults work for most hosted gateways.
  authHeader: "Authorization" # header name
  authScheme: "Bearer" # prefix; set to "" to send raw key
  extraHeaders: {} # any custom headers your gateway requires
    # x-tenant-id: juspay
    # x-client:    byne

checkpoints:
  compiler:
    command: cargo
    args: ["build", "--package", "connector-integration"] # Rust build for hyperswitch-prism
  cypress:
    command: npm
    args: ["run", "cy:run"] # control-center script: starts hyperswitch then runs cypress
  playwright:
    command: npm
    args: ["run", "pw:test"] # control-center script: runs playwright test
  regression:
    enabled: false # PAUSED — set to true to re-enable
    command: npm
    args: ["run", "re:build"]
  design_match:
    enabled: true
    screenshotRoute: "/"
  pr_review:
    requireHumanApproval: false
    humanApprovalTimeoutMs: 300000

# Parity Autopilot — see grace-workspace/docs/parity-autopilot-plan.md
# Paths can be overridden per machine via env vars (PARITY_PRISM_PATH,
# PARITY_ORACLE_PATH, PARITY_BRIDGE_PATH, PARITY_CREDS_PATH). Keep secrets
# (creds.json) out of this committed file by leaving credsPath empty here
# and exporting PARITY_CREDS_PATH locally.
parityAutopilot:
  prismPath: /Users/tushar.shukla/Downloads/Work/euler-ucs/hyperswitch-prism
  oracleReadOnlyPath: ""   # set PARITY_ORACLE_PATH to a hyperswitch clone (read-only)
  bridgeWritePath: ""      # set PARITY_BRIDGE_PATH (often same as oracle path) to enable hs-bridge locus
  credsPath: ""            # set PARITY_CREDS_PATH to abs path of creds.json

  github:
    owner: juspay
    repo: hyperswitch-cloud
    rootIssue: 15576
    actor: ""              # your GitHub login; sweep filters "PRs you authored" by this

  grpc:
    port: 8000
    metricsPort: 8080
    bootTimeoutMs: 30000
    callTimeoutMs: 60000

  cache:
    dir: .cache
    treeTtlMs: 21600000    # 6h

  llm:
    runner: "claude-code"
    understandModel: ""
    planModel: ""
    executeModel: ""

  heartbeat:
    pickOldestFirst: true
    maxInflightClaimed: 1
    sweepStalePrDays: 7
    rcaStaleHours: 24

  rules:
    forbiddenOracleDirs:
      - "crates/hyperswitch_connectors/"
      - "crates/hyperswitch_domain_models/"
      - "crates/api_models/"
      - "crates/router/"
    forbiddenPrismDirs:
      - "crates/types-traits/"
