[package]
name = "tracing-kafka"
version = "0.1.0"
edition = "2021"
description = "A generic Kafka tracing subscriber that reuses log_utils formatting"

[dependencies]
tracing = { workspace = true }
tracing-subscriber = "0.3"
rdkafka = "0.36"
serde_json = { workspace = true }
tokio = "1.0"
thiserror = { workspace = true }
# TEMPORARY: Amit's fork rev for `log_utils::record_json`; switch back to upstream once PR #20 lands.
log_utils = { git = "https://github.com/AmitsinghTanwar007/framework-libs-rs", rev = "8cc2e171e42ec831fd0def4cccdf1bfafacdb89a", package = "log_utils", features = ["tracing"] }

# Optional dependencies for metrics
prometheus = { version = "0.13", optional = true }

[lib]
name = "tracing_kafka"
path = "src/lib.rs"

[features]
default = ["kafka-metrics"]
kafka-metrics = ["dep:prometheus"]

[lints]
workspace = true
