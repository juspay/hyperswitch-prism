// ============================================================================
// ADDRESS & CUSTOMER DATA
// ============================================================================

// Represents a physical address with contact information
message Address {
  // Personal Information
  optional SecretString first_name = 1;
  optional SecretString last_name = 2;

  // Address Details
  optional SecretString line1 = 3;
  optional SecretString line2 = 4;
  optional SecretString line3 = 5;
  optional SecretString city = 6;
  optional SecretString state = 7;
  optional SecretString zip_code = 8;
  optional CountryAlpha2 country_alpha2_code = 9;

  // Contact Information
  optional SecretString email = 10;
  optional SecretString phone_number = 11;
  optional string phone_country_code = 12;
}

message Customer {
  optional SecretString name = 1;  // Customer's full name
  optional SecretString email = 2; // Customer's email address
  optional string id = 3;          // Internal customer ID
  optional string connector_customer_id =
      4;                                  // Customer ID in the connector system
  optional SecretString phone_number = 5; // Customer's phone number
  optional string phone_country_code = 6; // Customer's phone country code
  optional SecretString first_name = 7; // Customer's first name
  optional SecretString last_name = 8;  // Customer's last name
  optional string salutation = 9;       // Customer's salutation (Mr., Ms., etc.)
  optional CustomerDocumentDetails customer_document_details =
      10; // Customer identification document
  optional SecretString date_of_birth = 11; // Date of birth (ISO 8601: yyyy-MM-dd)
}

// Type of customer identification document.
enum DocumentKind {
  DOCUMENT_KIND_UNSPECIFIED = 0; // Default, unspecified document type.
  CPF = 1; // Cadastro de Pessoas Físicas - Brazilian individual taxpayer ID.
  CNPJ = 2; // Cadastro Nacional da Pessoa Jurídica - Brazilian business ID.
  PSN = 3; // Philippine PhilSys Number (12-digit national ID), required by dLocal for GCash.
  OTHER = 4; // Generic / other non-Brazilian national document; the connector validates it per country. Kept last as the catch-all.
}

// Customer's country-specific identification document.
message CustomerDocumentDetails {
  DocumentKind document_type = 1;   // The customer's document type
  SecretString document_number = 2; // The customer's document number
}
