// Package: ucs.v2
// File: common_types.proto
//
// Overview:
//   This file defines shared base types used across the Unified Connector
//   Service (UCS) v2 API: Money and Currency for monetary amounts, Address
//   for postal / contact data, and Customer (with its document identifiers)
//   for customer identity.
//
//   These messages were split out of payment.proto so that higher-level
//   files (e.g. domain.proto) can use them without creating circular
//   imports. Import this file wherever Money, Currency, Address or Customer
//   are referenced directly.
//
// Related Files:
//   - payment.proto         — Payment request/response messages
//   - payment_methods.proto — Payment method data types and SecretString

syntax = "proto3";

package types;

import "payment_methods.proto";

option go_package = "github.com/juspay/connector-service/crates/types-traits/grpc-api-types/proto;proto";

// ============================================================================
// CORE DATA TYPES
// ============================================================================

// Money represents a monetary amount with currency
// All amounts are in minor units (e.g., cents for USD)
message Money {
  int64 minor_amount = 1; // Amount in minor units (e.g., 1000 = $10.00)
  Currency currency = 2; // ISO 4217 currency code (e.g., "USD", "EUR")
}

