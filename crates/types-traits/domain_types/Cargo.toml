[package]
name = "domain_types"
version = "0.1.0"
edition = "2021"

[dependencies]
grpc-api-types = { path = "../grpc-api-types" }
common_enums = { path = "../../common/common_enums", package = "ucs_common_enums" }
cards = { path = "../cards", package = "ucs_cards" }
common_utils = { path = "../../common/common_utils", package = "ucs_common_utils", features = [
    "superposition",
] }
config_patch_derive = { path = "../../common/config_patch_derive" }

hyperswitch_masking = { version = "0.0.1", default-features = false, features = [
    "alloc",
    "serde",
    "time",
] }
# TODO! update to latest Hyperswitch Tag once hyperswitch_masking crate changes are merged to hyperswitch main
router_derive = { git = "https://github.com/juspay/hyperswitch", tag = "2026.06.18.0" }

#third party dependencies
thiserror = { workspace = true }
strum = { version = "0.26", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
# Only `connector_response_masking` uses these, so both hang off that feature: without it this
# crate does not depend on an XML or a form parser at all.
serde_urlencoded = { version = "0.7", optional = true }
quick-xml = { version = "0.31.0", features = ["serialize"], optional = true }
error-stack = "0.4.1"
base64 = "0.21"
rand = "0.8.5"
cpf_cnpj = "0.3"
bytes = { workspace = true }
regex = "1.11.1"


utoipa = { version = "4.2.0", features = [
    "preserve_order",
    "preserve_path_order",
] }
time = { version = "0.3.41", features = ["serde", "serde-well-known", "std"] }
url = { version = "2.5.4", features = ["serde"] }
http = "0.2.12"
actix-web = { version = "4.11.0", optional = true }
tracing = { workspace = true }
tonic = { workspace = true }

[dev-dependencies]
# Already in the lockfile; used to prove the config section parses in its real format.
toml = "0.8"

[features]
default = ["actix-web"]
actix-web = ["dep:actix-web"]
# Builds `masked_connector_response`. Off by default: it turns raw connector response bytes into a
# string the caller is handed back, so a build that does not opt in cannot produce one at all.
connector-response-masking = ["dep:quick-xml", "dep:serde_urlencoded"]
